# /systemrw uses x-systemd.automount so it is not mounted at early boot.
# Override After= and Requires= to ensure the automount unit activates
# /systemrw before the volatile bind for /etc/dump_level is attempted.
[Unit]
After=systemrw.mount
Requires=systemrw.mount
