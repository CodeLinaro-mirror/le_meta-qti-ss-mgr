BBPATH .= ":${LAYERDIR}"

BBFILE_COLLECTIONS        += "qti-ss-mgr"
BBFILE_PRIORITY_qti-ss-mgr = "12"
BBFILE_PATTERN_qti-ss-mgr := "^${LAYERDIR}/"

LAYERSERIES_COMPAT_qti-ss-mgr = "dunfell kirkstone"

BBFILES += "${LAYERDIR}/recipes/*/*.bb \
            ${LAYERDIR}/recipes/*/*.bbappend"

# Parse machine-image.bbappend only when msm layer present to
# ensure compatibility checks pass with latest meta-qti-bsp code base
BBFILES_DYNAMIC += " \
msm:${LAYERDIR}/recipes-products/images/machine-image.bbappend \
"
